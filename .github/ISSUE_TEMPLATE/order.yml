name: Launch QA request
description: Request the $10 proof-first Launch QA Sprint
title: "[LAUNCH QA] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the interest. This workflow is transparently AI-assisted. Do not post credentials, private files, personal data, seed phrases, or payment secrets here.

        For the $10 Launch QA Sprint, the feasibility reply confirms whether at least three distinct, reproducible findings exist and shows one complete sample finding. You pay only after that threshold is met; the full ranked 3–5 finding report is the paid deliverable.
  - type: input
    id: public_url
    attributes:
      label: Public website URL
      description: Submit one public HTTPS website you control or are authorized to have reviewed. Never paste a private or signed URL.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result you need, current problem, and acceptance criteria.
      placeholder: I need...
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline and timezone
      description: Optional. Leave blank if there is no hard deadline.
      placeholder: 2026-07-30 10:00 UTC
  - type: checkboxes
    id: payment
    attributes:
      label: Payment readiness
      description: Payment is requested only after the scope is confirmed and the feasibility preview shows at least three distinct, reproducible findings.
      options:
        - label: I can settle $10 in native USDC on Base if I accept the paid deliverable.
          required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I understand that the workflow is AI-assisted and checked against the agreed scope.
          required: true
        - label: I own or have permission to use the supplied material.
          required: true
        - label: I will not post credentials, sensitive personal data, or wallet secrets publicly.
          required: true
